schema: spec-driven

context: |
  Product: an iPhone app (Swift/SwiftUI, native) that turns clothing photos into Vinted listings; first user is a private seller in Germany, later sold to other private sellers via the App Store.
  Vinted offers no listing API for private sellers (Vinted Pro Integrations is business-only and allowlisted); the app MUST NOT automate Vinted, call its private API, or post on the user's behalf. The user always taps the final publish button inside Vinted.
  Listing text is generated in a user-selectable language (German and English at launch); app UI in German and English.
  AI calls go through our own backend proxy; no AI provider key ever ships in the app. Keep AI cost per listing well below 1 cent; prefer on-device Apple frameworks (Vision, Foundation Models) where they are good enough.
  Photos are personal data (GDPR): send only downscaled, metadata-free images, only when the user starts an analysis, and never store them on the server beyond the request.
  Mac support is a later phase; shared logic must stay in a platform-neutral Swift package.

