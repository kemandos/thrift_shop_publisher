<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thrift – Einstellungen</title>
    <link rel="stylesheet" href="../../src/ui/tailwind.css" />
  </head>
  <body class="m-0 bg-paper font-sans text-ink antialiased">
    <main class="mx-auto max-w-[560px] px-4 pt-6 pb-12">
      <h1 class="m-0 font-serif text-3xl font-medium tracking-tight">Einstellungen</h1>

      <section class="card mt-4 px-4 pt-1 pb-4">
        <h2 class="eyebrow mt-5 mb-2">KI-Zugang</h2>
        <div>
          <label class="radio-row"><input type="radio" name="mode" value="openrouter" /> OpenRouter (eigener Key)</label>
          <label class="radio-row"><input type="radio" name="mode" value="server" /> Eigener Server</label>
        </div>

        <div id="openrouter" class="mt-2">
          <label for="apiKey" class="mt-2.5 mb-1 block text-[13px] text-muted">OpenRouter-Key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-…" class="field" />
          <p id="apiKeyMasked" class="mt-1.5 min-h-4 text-[13px] text-muted"></p>
          <p class="text-[13px] text-muted">
            Key erstellen auf <a href="https://openrouter.ai/keys" target="_blank" rel="noopener" class="text-spruce underline">openrouter.ai/keys</a>.
            Ein Key für alle Modelle; abgerechnet wird über dein OpenRouter-Guthaben.
          </p>

          <h2 class="eyebrow mt-5 mb-2">Fotos &amp; Text</h2>
          <div id="models"></div>
          <h2 class="eyebrow mt-5 mb-2">Klicken &amp; Navigieren</h2>
          <div id="navModels"></div>
        </div>

        <div id="server" class="mt-2 hidden">
          <label for="serverUrl" class="mt-2.5 mb-1 block text-[13px] text-muted">Server-URL</label>
          <input id="serverUrl" type="url" placeholder="https://thrift.example.de" class="field" />
          <label for="serverToken" class="mt-2.5 mb-1 block text-[13px] text-muted">Token</label>
          <input id="serverToken" type="password" autocomplete="off" class="field" />
          <p id="serverTokenMasked" class="mt-1.5 min-h-4 text-[13px] text-muted"></p>
        </div>

        <button id="test" class="btn-ghost mt-3 w-full">Verbindung testen</button>
        <p id="testResult" class="mt-1.5 min-h-4 text-[13px] text-muted" role="status"></p>
      </section>

      <section class="card mt-4 px-4 pt-1 pb-2">
        <h2 class="eyebrow mt-5 mb-2">Sprache</h2>
        <div id="languages"></div>
        <h2 class="eyebrow mt-5 mb-2">Ton</h2>
        <div id="tones"></div>
      </section>

      <section class="card mt-4 px-4 pt-1 pb-4">
        <h2 class="eyebrow mt-5 mb-2">Schlusstext</h2>
        <label for="closingTextDe" class="mt-2.5 mb-1 block text-[13px] text-muted">Deutsch</label>
        <textarea id="closingTextDe" rows="2" placeholder="z. B. Versand innerhalb von 2 Tagen." class="field"></textarea>
        <label for="closingTextEn" class="mt-2.5 mb-1 block text-[13px] text-muted">English</label>
        <textarea id="closingTextEn" rows="2" placeholder="e.g. Ships within 2 days." class="field"></textarea>
      </section>

      <button id="save" class="btn-primary mt-4">Speichern</button>
      <p id="saved" class="mt-1.5 min-h-4 text-[13px] text-muted" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
