<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: Artikel verkaufen</title>
<!--
  Test fixture written for this project. It mirrors the *structure* of a marketplace upload form
  (photo area, text fields, tree/list/search pickers, price, upload button) without copying any
  third-party code. Variants via ?variant=desktop|mobile|broken.
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 720px; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .field { padding: 10px 0; border-bottom: 1px solid #eee; }
  .trigger { padding: 8px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; min-height: 20px; }
  .menu { border: 1px solid #aaa; background: #fff; padding: 4px; margin-top: 4px; }
  .menu li, .menu label { display: block; padding: 6px; cursor: pointer; list-style: none; }
  .modal { position: fixed; inset: 0; background: #fff; padding: 16px; overflow: auto; z-index: 10; }
  .cell { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .cell .sub { color: #666; font-size: 12px; }
  .dd { display: none; border: 1px solid #aaa; padding: 8px; }
  .dd.open { display: block; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { cursor: pointer; border: 1px solid #ccc; border-radius: 6px; padding: 10px; text-align: center; }
  .section { color: #666; font-size: 13px; padding: 8px 8px 4px; }
  .photos img { width: 80px; height: 100px; object-fit: cover; margin: 4px; }
</style>
</head>
<body>
<h1>Artikel verkaufen</h1>
<form id="itemForm">
<h2>Fotos</h2>
<div class="box photos" id="photoBox">
  <div id="thumbs"></div>
  <button type="button" id="addPhotos">+ Fotos hinzufügen</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>

<h2>Infos zu deinem Artikel</h2>
<div class="box">
  <div class="field"><span>Titel</span><br><input id="title" placeholder="Teile Käufern mit, was du verkaufst"></div>
  <div class="field"><span>Beschreibung</span><br><textarea id="description" rows="4" placeholder="Erzähle Käufern mehr darüber"></textarea></div>
</div>

<h2>Artikeldetails</h2>
<div class="box" id="details"></div>

<div class="box"><div class="field"><span>Preis</span><br><input id="price" inputmode="decimal"></div></div>

<button type="button" id="draft">Entwurf speichern</button>
<button type="submit" id="upload">Hochladen</button>
</form>

<script>
(() => {
  const variant = new URLSearchParams(location.search).get("variant") || "desktop";
  const mobile = variant === "mobile";
  const state = (window.__state = { title: "", description: "", price: "", category: [], brand: "", size: "", condition: "", colors: [], material: "", submitted: false, draft: false });

  // "Controlled" inputs: state only changes through input events, like a React form.
  for (const id of ["title", "description", "price"]) {
    const el = document.getElementById(id);
    if (!mobile && id === "title") el.setAttribute("data-testid", "title--input");
    el.addEventListener("input", (e) => { state[id] = e.target.value; });
  }
  document.getElementById("upload").addEventListener("click", () => { state.submitted = true; });
  document.getElementById("draft").addEventListener("click", () => { state.draft = true; });
  document.getElementById("itemForm").addEventListener("submit", (e) => { e.preventDefault(); state.submitted = true; });

  const TREE = {
    Damen: { Kleidung: { "Pullover & Sweatshirts": ["Strickpullover", "Sweatshirts", "Hoodies"], Jeans: ["Skinny", "Straight"], Kleider: ["Minikleider", "Maxikleider"] }, Schuhe: ["Sneaker", "Stiefel"] },
    Herren: { Kleidung: { Pullover: ["Strickpullover"], Jeans: ["Slim"] } },
    Kinder: ["Mädchen", "Jungen"],
    Haus: ["Deko"],
  };
  const BRANDS = ["COS", "Zara", "H&M", "Levi's", "Mango", "Cos Bar"];
  const SIZES = ["XS", "S", "M", "L", "XL"];
  const CONDITIONS = ["Neu mit Etikett", "Neu ohne Etikett", "Sehr gut", "Gut", "Zufriedenstellend"];
  const COLORS = ["Schwarz", "Weiß", "Beige", "Blau", "Rot"];

  let open = null; // { panel, close }
  function closeOpen() { if (open) { open.panel.remove(); open = null; } }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOpen(); });

  function makePanel(anchor) {
    closeOpen();
    const panel = document.createElement("div");
    if (mobile) { panel.className = "modal"; panel.setAttribute("role", "dialog"); document.body.append(panel); }
    else { panel.className = "menu"; anchor.after(panel); }
    open = { panel };
    return panel;
  }
  function list(panel, items, onPick, role = "option") {
    const ul = document.createElement("ul");
    ul.setAttribute("role", "listbox");
    for (const it of items) {
      const li = document.createElement("li");
      li.setAttribute("role", role);
      li.textContent = it;
      li.addEventListener("click", () => onPick(it));
      ul.append(li);
    }
    panel.append(ul);
  }

  // ---- variant=vinted: structure as seen on vinted.de (2026-10-09 screenshots) ----
  // Read-only inputs with "Wähle …" placeholders, rows are plain clickable <div>s (no roles),
  // category picker with search box, a "Vorgeschlagen" suggestion and a tree whose rows are reused.
  if (variant === "vinted") {
    const params = new URLSearchParams(location.search);
    const noSearch = params.get("nosearch") === "1";
    const details = document.getElementById("details");
    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const row = (label, placeholder) => {
      const f = mk("div", "field");
      f.append(mk("span", "", label));
      const input = mk("input");
      input.readOnly = true; input.placeholder = placeholder;
      f.append(input); details.append(f);
      return input;
    };
    const cell = (title, sub, onPick) => {
      const c = mk("div", "cell");
      const left = mk("div");
      const t = mk("div", "title", title);
      left.append(t);
      const s2 = mk("div", "sub", sub || ""); if (sub) left.append(s2);
      c.append(left, mk("span", "chev", "›"));
      c.addEventListener("click", () => c._pick());
      c._pick = onPick;
      c._set = (title2, sub2, pick2) => { t.textContent = title2; s2.textContent = sub2 || ""; if (sub2 && !s2.isConnected) left.append(s2); if (!sub2) s2.remove(); c._pick = pick2; };
      return c;
    };
    const leaves = [];
    const walk = (node, path) => {
      for (const k of Array.isArray(node) ? node : Object.keys(node)) {
        if (Array.isArray(node)) leaves.push({ name: k, path });
        else walk(node[k], [...path, k]);
      }
    };
    walk(TREE, []);
    const VTREE = { ...TREE };

    const inputs = {
      category: row("Kategorie", "Wähle eine Kategorie"),
      brand: row("Marke", "Wähle eine Marke"),
      size: row("Größe", "Wähle eine Größe"),
      condition: row("Zustand", "Wähle einen Zustand"),
      color: row("Farbe", "Wähle bis zu 2 Farben"),
      material: row("Material (empfohlen)", "Wähle ein Material"),
    };
    // ?autodetect=1: like vinted.de, category and brand are suggested from title/description.
    if (params.get("autodetect") === "1") {
      let t = null;
      document.getElementById("description").addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => {
          inputs.category.value = "Strickpullover";
          state.category = ["Damen", "Kleidung", "Pullover & Sweatshirts", "Strickpullover"];
          const brand = BRANDS.find((b) => state.title.includes(b));
          if (brand) { inputs.brand.value = brand; state.brand = brand; }
        }, 700);
      });
    }
    if (params.get("preset")) { inputs.category.value = params.get("preset"); state.category = ["(preset)", params.get("preset")]; }

    const choose = (key, value, display) => { state[key] = value; inputs[key].value = display; closeOpen(); };

    inputs.category.addEventListener("click", () => {
      const panel = makePanel(inputs.category);
      let search = null;
      if (!noSearch) { search = mk("input"); search.placeholder = "Finde eine Kategorie"; panel.append(search); }
      const body = mk("div"); panel.append(body);
      const pickLeaf = (leaf) => choose("category", [...leaf.path, leaf.name], leaf.name);
      // Suggestion for the wrong department on purpose: Thrift must not take it.
      const renderHome = () => {
        body.replaceChildren();
        body.append(mk("div", "section", "Vorgeschlagen"));
        body.append(cell("Strickpullover", "Herren > Kleidung > Pullover", () => pickLeaf({ name: "Strickpullover", path: ["Herren", "Kleidung", "Pullover"] })));
        body.append(mk("div", "section", "Katalog-Kategorien"));
        const list = mk("div"); body.append(list);
        let node = VTREE; const path = [];
        const cells = [];
        const renderLevel = () => {
          const items = Array.isArray(node) ? node : Object.keys(node);
          items.forEach((it, i) => {
            const pick = () => {
              if (Array.isArray(node)) { pickLeaf({ name: it, path: path.slice() }); return; }
              path.push(it); node = node[it]; renderLevel();
            };
            if (cells[i]) cells[i]._set(it, "", pick); // reuse row elements like React does
            else { cells[i] = cell(it, "", pick); list.append(cells[i]); }
          });
          cells.slice(items.length).forEach((c) => c.remove());
          cells.length = items.length;
        };
        renderLevel();
      };
      renderHome();
      search?.addEventListener("input", () => {
        const q = search.value.trim().toLowerCase();
        if (!q) { renderHome(); return; }
        body.replaceChildren();
        for (const leaf of leaves.filter((l) => l.name.toLowerCase().includes(q))) {
          body.append(cell(leaf.name, leaf.path.join(" > "), () => pickLeaf(leaf)));
        }
      });
    });

    inputs.brand.addEventListener("click", () => {
      const panel = makePanel(inputs.brand);
      const search = mk("input"); search.placeholder = "Finde eine Marke"; panel.append(search);
      const holder = mk("div"); panel.append(holder);
      const render = (q) => { holder.replaceChildren(); for (const b of BRANDS.filter((b) => b.toLowerCase().includes(q.toLowerCase()))) holder.append(cell(b, "", () => choose("brand", b, b))); };
      search.addEventListener("input", () => render(search.value));
      render("");
    });
    // Size: like vinted.de – pre-rendered and only shown on open; info box, help links; tiles whose
    // click handler sits on the inner text element (a click on the tile itself does nothing).
    const sizeDd = mk("div", "dd");
    const info = mk("div", "", "Wähle die Größe vom Etikett – wir kümmern uns um den Rest");
    const more = mk("a", "", "Erfahre mehr"); more.href = "/help/size";
    info.append(" ", more);
    const head = mk("div");
    head.append(mk("span", "", "S/M/L"), " ");
    const table = mk("button", "", "Größentabelle"); table.type = "button";
    table.addEventListener("click", () => { state.sizeTable = true; });
    head.append(table);
    const tiles = mk("div", "tiles");
    for (const sz of [...SIZES, "XXL", "XXXL", "4XL"]) {
      const tile = mk("div", "tile");
      const txt = mk("span", "", sz);
      txt.addEventListener("click", (e) => { e.stopPropagation(); state.size = sz; inputs.size.value = sz; sizeDd.classList.remove("open"); open = null; });
      tile.append(txt);
      tiles.append(tile);
    }
    sizeDd.append(info, head, tiles);
    inputs.size.after(sizeDd);
    inputs.size.addEventListener("click", () => {
      closeOpen();
      sizeDd.classList.add("open");
      open = { panel: { remove: () => sizeDd.classList.remove("open") } };
    });
    inputs.condition.addEventListener("click", () => {
      const panel = makePanel(inputs.condition);
      const hints = { "Sehr gut": "Wenig benutzt, kaum Gebrauchsspuren", Gut: "Benutzt, leichte Gebrauchsspuren" };
      for (const c of CONDITIONS) panel.append(cell(c, hints[c] || "", () => choose("condition", c, c)));
    });
    inputs.color.addEventListener("click", () => {
      const panel = makePanel(inputs.color);
      for (const c of COLORS) panel.append(cell(c, "", () => {
        state.colors = state.colors.includes(c) ? state.colors.filter((x) => x !== c) : [...state.colors, c].slice(0, 2);
        inputs.color.value = state.colors.join(", ");
      }));
    });
    inputs.material.addEventListener("click", () => {
      const panel = makePanel(inputs.material);
      for (const m of ["Baumwolle", "Wolle", "Polyester"]) panel.append(cell(m, "", () => choose("material", m, m)));
    });
  } else {
  const fields = [
    ["category", variant === "broken" ? "Rubrik" : "Kategorie", "catalog-select-dropdown-input"],
    ["brand", "Marke", "brand-select-dropdown-input"],
    ["size", "Größe", "size-select-dropdown-input"],
    ["condition", variant === "broken" ? "Artikelzustand" : "Zustand", "status-select-dropdown-input"],
    ["color", "Farbe", "color-select-dropdown-input"],
  ];
  const details = document.getElementById("details");
  const triggers = {};
  for (const [key, label, testid] of fields) {
    const f = document.createElement("div");
    f.className = "field";
    const l = document.createElement("span");
    l.textContent = label;
    const t = document.createElement("div");
    t.className = "trigger";
    t.tabIndex = 0;
    t.setAttribute("role", "combobox");
    if (!mobile && variant !== "broken") t.setAttribute("data-testid", testid);
    t.textContent = "Auswählen";
    f.append(l, t);
    details.append(f);
    triggers[key] = t;
  }

  triggers.category.addEventListener("click", () => {
    const panel = makePanel(triggers.category);
    let node = TREE; const path = [];
    const render = () => {
      panel.replaceChildren();
      const items = Array.isArray(node) ? node : Object.keys(node);
      list(panel, items, (it) => {
        path.push(it);
        const next = Array.isArray(node) ? null : node[it];
        if (!next) { state.category = path.slice(); triggers.category.textContent = path.join(" › "); closeOpen(); return; }
        node = next; render();
      });
    };
    render();
  });

  triggers.brand.addEventListener("click", () => {
    const panel = makePanel(triggers.brand);
    const search = document.createElement("input");
    search.type = "search"; search.placeholder = "Marke suchen";
    panel.append(search);
    const holder = document.createElement("div"); panel.append(holder);
    const render = (q) => { holder.replaceChildren(); list(holder, BRANDS.filter((b) => b.toLowerCase().includes(q.toLowerCase())), (b) => { state.brand = b; triggers.brand.textContent = b; closeOpen(); }); };
    search.addEventListener("input", () => render(search.value));
    render("");
  });

  triggers.size.addEventListener("click", () => {
    const panel = makePanel(triggers.size);
    list(panel, SIZES, (s) => { state.size = s; triggers.size.textContent = s; closeOpen(); });
  });

  triggers.condition.addEventListener("click", () => {
    const panel = makePanel(triggers.condition);
    list(panel, CONDITIONS, (c) => { state.condition = c; triggers.condition.textContent = c; closeOpen(); }, "radio");
  });

  triggers.color.addEventListener("click", () => {
    const panel = makePanel(triggers.color);
    for (const c of COLORS) {
      const lab = document.createElement("label");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = state.colors.includes(c);
      cb.addEventListener("change", () => {
        state.colors = cb.checked ? [...state.colors, c].slice(0, 2) : state.colors.filter((x) => x !== c);
        triggers.color.textContent = state.colors.join(", ") || "Auswählen";
      });
      lab.append(cb, " " + c);
      panel.append(lab);
    }
  });

  } // end non-vinted variants

  // Photos: test hook + real file input.
  const thumbs = document.getElementById("thumbs");
  window.__addPhoto = (blob) => { const img = document.createElement("img"); img.src = URL.createObjectURL(blob); thumbs.append(img); };
  document.getElementById("addPhotos").addEventListener("click", () => document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", (e) => { for (const f of e.target.files) window.__addPhoto(f); });
})();
</script>
</body>
</html>
