# XcodeGen spec for the Thrift iPhone container app + Safari Web Extension.
# Generate the project with:  cd ios && xcodegen
# Signing team: set DEVELOPMENT_TEAM in Config/Signing.local.xcconfig (see README.md).
name: Thrift

options:
  bundleIdPrefix: app.thrift
  developmentLanguage: de
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Swift 5 language mode; the sources are also written to compile in Swift 6 mode.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # DEVELOPMENT_TEAM is intentionally NOT set here (it would override the xcconfig).

targets:
  Thrift:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: ThriftExtension
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Thrift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/Thrift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.thrift.companion
        keychain-access-groups:
          - "$(AppIdentifierPrefix)app.thrift.shared"
    settings:
      base:
        PRODUCT_NAME: Thrift
        PRODUCT_BUNDLE_IDENTIFIER: app.thrift.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ThriftExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    # Copies extension/.output/safari-mv3/* into the root of ThriftExtension.appex
    # (where Safari expects manifest.json). See scripts/copy-web-extension.sh.
    preBuildScripts:
      - name: Copy Safari web extension build
        # Plain $SRCROOT (no braces): XcodeGen expands ${VAR} from its own environment.
        script: /bin/bash "$SRCROOT/scripts/copy-web-extension.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Thrift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/ThriftExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.thrift.companion
        keychain-access-groups:
          - "$(AppIdentifierPrefix)app.thrift.shared"
    settings:
      base:
        PRODUCT_NAME: ThriftExtension
        PRODUCT_BUNDLE_IDENTIFIER: app.thrift.companion.extension
        SKIP_INSTALL: YES
        # The copy script reads ../extension/.output, outside the sandboxed inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Thrift:
    build:
      targets:
        Thrift: all
        ThriftExtension: all
    run:
      config: Debug
    archive:
      config: Release
